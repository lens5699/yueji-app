 function roundRect(ctx,x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.stroke();}}
 function drawText(ctx,text,x,y,size=30,color='#332c25',weight=400,maxWidth=880,lineHeight=size*1.6){ctx.font=`${weight} ${size}px "Microsoft YaHei",sans-serif`;ctx.fillStyle=color;let line='',yy=y;for(const ch of String(text)){if(ctx.measureText(line+ch).width>maxWidth&&line){ctx.fillText(line,x,yy);line=ch;yy+=lineHeight;}else line+=ch;}ctx.fillText(line,x,yy);return yy;}
 function makeCard(format){const can=document.createElement('canvas');can.width=1080;can.height=format==='print'?1528:1920;const ctx=can.getContext('2d'),h=can.height;ctx.fillStyle='#fbefdf';ctx.fillRect(0,0,1080,h);let g=ctx.createRadialGradient(100,150,10,100,150,700);g.addColorStop(0,'#f5bf77');g.addColorStop(1,'#fbefdf00');ctx.fillStyle=g;ctx.fillRect(0,0,1080,h);g=ctx.createRadialGradient(1080,h-300,10,1080,h-300,800);g.addColorStop(0,'#ebbf4b99');g.addColorStop(1,'#fbefdf00');ctx.fillStyle=g;ctx.fillRect(0,0,1080,h);const top=format==='print'?80:250;roundRect(ctx,70,top,940,h-top-110,50,'#fff9','#fff');let y=top+90;drawText(ctx,'悦己有度  ·  我的消费安排',125,y,25,'#a07135',500);y+=75;drawText(ctx,`${s().name||'我'}的`,125,y,Math.min(40,Math.floor(800/((s().name||'我').length+1))),'#332c25',550,800);y+=65;drawText(ctx,'情绪健康守则',125,y,49,'#332c25',650);const v=currentValues();y+=104;drawText(ctx,'本月情绪预算',125,y,27,'#8d7355');y+=105;drawText(ctx,yuan(v.monthly),125,y,91,'#bd6609',650);y+=55;drawText(ctx,(state.mode==='demo'?LINXIAO_CASE.end:MONTH).replace('-','年')+'月',130,y,23,'#a08867');y+=60;roundRect(ctx,125,y,395,130,30,'#f2d59866');roundRect(ctx,548,y,405,130,30,'#f7ca9e66');drawText(ctx,'周参考额度',155,y+43,24,'#947344');drawText(ctx,yuan(v.weekly),155,y+93,37,'#a65c10',600);drawText(ctx,'单笔冷静线',578,y+43,24,'#947344');drawText(ctx,yuan(v.threshold),578,y+93,37,'#a65c10',600);y+=215;const rules=['不挪用必要生活费',`超过${C.money(v.threshold)}元，先等${v.hours}小时`,'每周记录与复盘'];for(let i=0;i<rules.length;i++){ctx.beginPath();ctx.fillStyle='#e3aa32';ctx.arc(147,y-11,15,0,Math.PI*2);ctx.fill();drawText(ctx,'✓',137,y-2,23,'#fff',600);y=drawText(ctx,rules[i],186,y,32,'#4b3926',500,740,48)+83;}const foot=Math.max(y+5,h-235);drawText(ctx,'按每月4周简算，月总额为上限',125,foot,24,'#9a8163',400,820);drawText(ctx,'参数由你设定，可以随情况调整',125,foot+47,24,'#9a8163');drawText(ctx,'CFPB财务福祉视角 · 个人设置',125,foot+94,20,'#b19b81');return can;}
 function rules(){openModal(TITLES.rules,`<div class="export-options"><button data-format="wallpaper" class="${exportFormat==='wallpaper'?'active':''}">手机壁纸</button><button data-format="print" class="${exportFormat==='print'?'active':''}">A5打印卡</button></div><img id="rule-image" class="card-preview" alt="专属情绪健康守则卡预览"><div class="actions"><button class="primary" data-action="download-card">${icon('down')}保存图片</button><button class="secondary" data-action="print">${icon('print')}打印卡片</button></div><p class="field-help">手机壁纸1080×1920；A5版1080×1528。${state.mode==='demo'?'数值取自案例改变后（2026年10月）的规则设置。':'数值取自当前月份已保存设置。'}</p>${knowledge('rules')}`,'rules');exportCanvas=makeCard(exportFormat);$('#rule-image').src=exportCanvas.toDataURL('image/png');}
 function download(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);}
 function backup(){download(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),'悦己有度-手账备份-'+TODAY+'.json');toast('备份已导出，可在设置中恢复');}
 function importBackup(){const input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=async()=>{try{const file=input.files[0];if(!file)return;if(file.size>5e6)throw Error('文件过大，请选择手账备份JSON');const x=JSON.parse(await file.text());if(x.version!==1||!['demo','personal'].includes(x.mode))throw Error('不是本页支持的备份');for(const key of ['demo','personal']){const q=x[key];if(!q||!Array.isArray(q.records)||!q.records.every(C.validateRecord)||!Array.isArray(q.pending)||!q.budgets||typeof q.budgets!=='object')throw Error('备份内容不完整');C.budget(q.settings);if(!Number.isFinite(q.settings.threshold)||q.settings.threshold<0||!Number.isInteger(q.settings.hours)||q.settings.hours<1||q.settings.hours>720||typeof q.settings.name!=='string'||q.settings.name.length>24)throw Error('备份设置无效');if(!Object.values(q.budgets).every(v=>Number.isSafeInteger(v)&&v>=0))throw Error('备份预算无效');if(!q.pending.every(p=>typeof p.id==='string'&&typeof p.title==='string'&&Number.isSafeInteger(p.cents)&&p.cents>0&&Number.isFinite(p.until)&&Number.isInteger(p.hours)&&typeof p.status==='string'))throw Error('等待清单数据无效');if(q.customActivities&&!q.customActivities.every(a=>Array.isArray(a)&&a.length===3&&a.every(v=>typeof v==='string')))throw Error('活动清单数据无效');}if(!confirm('恢复备份会替换此浏览器的两份手账。继续吗？'))return;state=x;save();closeModal();render();toast('手账已恢复');}catch(e){toast('恢复失败：'+e.message);}};input.click();}
 function card(key){({monthly,weekly,threshold,cooling,alternatives,rules}[key]||monthly)();}
 document.addEventListener('click',e=>{const btn=e.target.closest('button');if(!btn)return;if(btn.dataset.period){period=btn.dataset.period;render();return;}if(btn.dataset.card){card(btn.dataset.card);return;}if(btn.dataset.edit){recordForm(btn.dataset.edit);return;}if(btn.dataset.delete){if(confirm('删除这笔记录？对应统计也会更新。')){b().records=b().records.filter(r=>r.id!==btn.dataset.delete);save();closeModal();render();toast('记录已删除');}return;}if(btn.dataset.activity){const day=b().activities[TODAY]||[];b().activities[TODAY]=day.includes(btn.dataset.activity)?day.filter(k=>k!==btn.dataset.activity):[...day,btn.dataset.activity];save();const scroll=$('#modal').scrollTop;alternatives();$('#modal').scrollTop=scroll;return;}if(btn.dataset.intent){const fd=new FormData($('#record-form'));recordForm(null,{title:fd.get('title'),cents:Number(fd.get('amount'))>0&&Number(fd.get('amount'))<=1e9?C.cents(fd.get('amount')):0,note:fd.get('note'),category:fd.get('category'),date:fd.get('date')},btn.dataset.intent);return;}if(btn.dataset.mode){state.mode=btn.dataset.mode;anchor=state.mode==='demo'?LINXIAO_CASE.asOf:TODAY;save();closeModal();render();if(state.mode==='personal'&&!s().income)monthly(true);return;}if(btn.dataset.format){exportFormat=btn.dataset.format;rules();return;}if(btn.dataset.reconsider){const p=b().pending.find(x=>x.id===btn.dataset.reconsider);if(p&&p.until<=Date.now()){if(state.mode==='demo')caseRecordChoice();else recordForm(null,{...p,pendingId:p.id},'spent');}return;}if(btn.dataset.release){const p=b().pending.find(x=>x.id===btn.dataset.release);if(p)p.status='released';save();render();pending();toast('已放下这次购买');return;}const action=btn.dataset.action;if(!action)return;switch(action){case'home':closeModal();window.scrollTo({top:0,behavior:'smooth'});break;case'close':closeModal();break;case'prev':navigatePeriod(-1);break;case'next':navigatePeriod(1);break;case'today':anchor=state.mode==='demo'?LINXIAO_CASE.asOf:TODAY;render();break;case'profile':monthly(true);break;case'sources':sources();break;case'mode':mode();break;case'record':if(state.mode==='demo')caseRecordChoice();else recordForm();break;case'records':records();break;case'rules':rules();break;case'pending':pending();break;case'new-pending':recordForm(null,{},'wait');break;case'sample':sample();break;case'confirm-sample':loadSample();break;case'backup':backup();break;case'import':importBackup();break;case'download-card':if(exportCanvas)exportCanvas.toBlob(blob=>{if(blob)download(blob,`${s().name}-情绪健康守则-${exportFormat==='print'?'打印版':'壁纸'}.png`);});break;case'print':{const can=makeCard('print'),img=document.createElement('img');img.alt='专属守则卡';img.src=can.toDataURL('image/png');$('#print-root').replaceChildren(img);img.decode().then(()=>window.print()).catch(()=>toast('打印图像未能加载，请先保存图片')); break;}}});
 setInterval(()=>{if(activeDialog==='pending'){document.querySelectorAll('[data-until]').forEach(el=>{el.textContent=remain(Number(el.dataset.until)-Date.now());});document.querySelectorAll('[data-reconsider]').forEach(el=>{const p=b().pending.find(x=>x.id===el.dataset.reconsider);if(p)el.disabled=p.until>Date.now();});}},30000);
 function caseMonth(){return LINXIAO_CASE.months.find(x=>x.month===anchor.slice(0,7))||LINXIAO_CASE.months[LINXIAO_CASE.months.length-1];}
 function fmtMonth(m){return Number(m.slice(5))+'月';}
 function navigatePeriod(delta){const next=C.shift(anchor,period,delta),r=C.range(next,period);if(state.mode==='demo'&&(r.end<LINXIAO_CASE.start+'-01'||r.start>LINXIAO_CASE.asOf)){toast('这套案例覆盖2026年1—10月');return;}anchor=next;render();}
 function caseIntro(){const x=caseMonth(),june=LINXIAO_CASE.months[5],oct=LINXIAO_CASE.months[9];return `<section class="case-intro glass"><div class="case-title-line"><div><div class="eyebrow">LIN XIAO · A FICTIONAL CASE</div><h2>林晓的改变日历</h2><p>28岁 · 都市职场女性 · 案例月收入¥12,000</p></div><span class="pill">全套虚构账单</span></div><div class="case-metrics"><div><small>1—6月盲盒累计</small><strong>¥35,000</strong></div><div><small>6月末借款余额</small><strong>${yuan(june.debtCents)}</strong></div><div><small>10月情绪消费</small><strong>${yuan(oct.emotionalCents)}</strong></div></div><div class="case-months" aria-label="选择林晓案例月份">${LINXIAO_CASE.months.map(m=>`<button data-case-month="${m.month}" class="${m.month===anchor.slice(0,7)?'active':''}" aria-pressed="${m.month===anchor.slice(0,7)}"><strong>${fmtMonth(m.month)}</strong><small>${m.month<'2026-07'?'调整前':m.month==='2026-07'?'起步':m.month==='2026-09'?'复盘':'保持'}</small></button>`).join('')}</div><div class="case-stage"><span>${esc(x.stage)}</span><h3>${esc(x.title)}</h3><p>${esc(x.change)}</p><p class="case-action-note">${esc(x.action)}</p></div><div class="case-intro-actions"><button class="secondary" data-case-action="journey">${icon('calendar')}逐月收支</button><button class="primary" data-case-action="compare">${icon('arrow')}6月与10月对比</button><button class="text-btn" data-case-action="assumptions">数据设定说明</button></div></section>`;}
 function caseFinancialPanel(){const x=caseMonth();return `<section class="case-finances glass"><div class="section-head"><div><h2>${fmtMonth(x.month)} · 生活与收支</h2><p class="small muted">情绪支出之外，也要看完整的月度安排。</p></div><button class="text-btn" data-case-action="bill">查看完整账单</button></div><div class="case-finance-grid"><div><small>案例月收入</small><strong>${yuan(x.incomeCents)}</strong></div><div><small>必要生活支出</small><strong>${yuan(x.necessaryCents)}</strong></div><div><small>情绪消费</small><strong>${yuan(x.emotionalCents)}</strong></div><div><small>本月收支差额</small><strong class="${x.netCents<0?'over-budget':''}">${x.netCents<0?'−':'+'}${yuan(Math.abs(x.netCents))}</strong></div><div><small>期末现金</small><strong>${yuan(x.cashCents)}</strong></div><div><small>期末借款余额</small><strong>${yuan(x.debtCents)}</strong></div></div><p class="field-help">工资 − 必要生活支出 − 情绪消费 = 本月收支差额。借款与还款只改变现金和债务，不重复计为消费。</p></section>`;}
 function caseRecordChoice(){openModal('选择怎么记录',`<p class="modal-topnote">林晓的1—10月账单已完整预置，用于前后变化演示。你可以查看详细记录，或切换个人手账记录自己的消费。</p><div class="actions"><button class="secondary" data-case-action="bill">查看林晓账单</button><button class="primary" data-mode="personal">打开我的手账</button></div>`,'case-choice');}
 function caseCompare(){const a=LINXIAO_CASE.months[5],z=LINXIAO_CASE.months[9],rows=[['情绪消费总额',a.emotionalCents,z.emotionalCents],['其中：盲盒消费',a.blindCents,z.blindCents],['其中：演出总费用',a.concertCents,z.concertCents],['期末借款余额',a.debtCents,z.debtCents],['期末现金',a.cashCents,z.cashCents]];openModal('把改变放到账单里看',`<span class="pill">虚构案例 · 不是实测干预效果</span><h3 class="case-modal-title">6月：失控高风险 → 10月：稳定保持</h3><div class="case-table-wrap"><table class="case-table"><thead><tr><th>观察项</th><th>6月</th><th>10月</th></tr></thead><tbody>${rows.map(([t,v,w])=>`<tr><td>${t}</td><td>${yuan(v)}</td><td>${yuan(w)}</td></tr>`).join('')}<tr><td>盲盒订单数</td><td>${a.count}笔</td><td>${z.count}笔</td></tr></tbody></table></div><div class="case-comment"><h3>改变是怎么发生的？</h3><p>7月先设限，但情绪消费仍超预算；8月下降，9月盲盒支出小幅反复，10月才回到更稳定的安排。</p><p>10月仍花680元用于本地演出。判断变化要结合资金来源、停止能力与生活后果，不能只看“有没有继续花钱”。</p></div><button class="primary modal-submit" data-case-action="journey">查看逐月过程</button><p class="field-help">金额逐笔相加，现金和借款按月勾稽。以上是情境创作，不用于临床判断，也不证明某条规则必然有效。</p>`,'case-compare');}
 function caseJourney(){const max=Math.max(...LINXIAO_CASE.months.map(x=>x.emotionalCents));openModal('1—10月 · 改变的过程',`<p class="modal-topnote">前6个月盲盒累计35,000元。7月开始调整，过程中有超预算和反复。点任意月份回到该月总览。</p><div class="journey-list">${LINXIAO_CASE.months.map(x=>`<button class="journey-row" data-case-month="${x.month}"><span class="journey-date">${fmtMonth(x.month)}<small>${x.stage}</small></span><span class="journey-bar"><i style="width:${Math.max(5,x.emotionalCents/max*100)}%"></i></span><strong>${yuan(x.emotionalCents)}</strong></button>`).join('')}</div><div class="case-table-wrap"><table class="case-table"><thead><tr><th>月份</th><th>收入</th><th>生活支出</th><th>情绪消费</th><th>现金</th><th>借款</th></tr></thead><tbody>${LINXIAO_CASE.months.map(x=>`<tr><td>${fmtMonth(x.month)}</td><td>${C.money(x.incomeCents)}</td><td>${C.money(x.necessaryCents)}</td><td>${C.money(x.emotionalCents)}</td><td>${C.money(x.cashCents)}</td><td>${C.money(x.debtCents)}</td></tr>`).join('')}</tbody></table></div><p class="field-help">表内金额单位：元。现金、借款为当月期末余额。2026年11—12月不在这套案例账本内。</p><button class="secondary" style="width:100%" data-case-action="download-summary">导出月度汇总 CSV</button>`,'case-journey');}
 let caseLedgerTab='emotion';
 function caseBill(){const x=caseMonth(),emotions=LINXIAO_CASE.records.filter(r=>r.date.startsWith(x.month)),living=LINXIAO_CASE.supporting.filter(r=>r.month===x.month),rows=(caseLedgerTab==='emotion'?emotions:caseLedgerTab==='living'?living:[...living,...emotions]).slice().sort((a,z)=>z.date.localeCompare(a.date)||(z.time||'').localeCompare(a.time||''));openModal(fmtMonth(x.month)+' · 完整模拟账单',`<p class="modal-topnote">${esc(x.title)}。本月情绪支出${yuan(x.emotionalCents)}，必要生活支出${yuan(x.necessaryCents)}。下面可查看全部${emotions.length}笔情绪消费及月度生活收支。</p><div class="case-ledger-tabs" role="tablist" aria-label="账单范围">${[['emotion','情绪消费'],['living','生活收支'],['all','全部流水']].map(([key,t])=>`<button class="${caseLedgerTab===key?'active':''}" data-case-ledger="${key}" role="tab" aria-selected="${caseLedgerTab===key}">${t}</button>`).join('')}</div><div class="case-bill-list">${rows.map(r=>r.caseRecord?entryHTML(r):`<div class="entry"><span class="entry-icon">${icon(r.flow==='income'?'wallet':'list')}</span><div class="entry-info"><strong>${esc(r.title)}</strong><small>${r.date.slice(5).replace('-','.')} · ${esc(r.category)} · 模拟</small></div><span class="entry-money">${['income','financing-in'].includes(r.flow)?'+':'−'}${yuan(r.cents)}</span></div>`).join('')}</div><p class="field-help">必要生活支出为月度归集项；借入和还款列为资金往来，计算情绪消费总额时不包含它们。</p><div class="actions"><button class="secondary" data-case-action="download-detail">${icon('down')}导出本月明细</button><button class="secondary" data-action="close">返回总览选月份</button></div>`,'case-bill');}
 function caseRecordDetail(recordId){const r=LINXIAO_CASE.records.find(x=>x.id===recordId);if(!r)return;openModal('一笔选择 · 情境说明',`${hero(r.category==='盲盒潮玩'?'card':'spark',esc(r.title),yuan(r.cents),'虚构订单 · 完成支出')}<div class="fields"><div class="field"><span>发生时间</span><strong>${r.date} ${r.time}</strong></div><div class="field"><span>消费类别</span><strong>${esc(r.category)}</strong></div><div class="field"><span>情境行为</span><strong>${esc(r.decision)}</strong></div></div><div class="case-comment"><h3>为什么把这笔写进账单</h3><p>${esc(r.note)}</p></div><p class="field-help">金额、时间和旁白为案例创作。单笔订单不能独立证明成瘾或健康。</p><button class="primary modal-submit" data-case-action="bill">返回当月全部明细</button>`,'case-record');}
 function caseAssumptions(){openModal('这套账单是如何设定的',`<div class="case-comment"><h3>故事要能看，数字也要能对上</h3>${LINXIAO_CASE.notes.map(t=>`<p>${esc(t)}</p>`).join('')}</div><div class="fields"><div class="field"><span>覆盖月份</span><strong>2026年1—10月</strong></div><div class="field"><span>每月案例收入</span><strong>¥12,000</strong></div><div class="field"><span>必要生活支出</span><strong>¥5,800</strong></div><div class="field"><span>10月末现金 / 借款</span><strong>¥14,220 / ¥0</strong></div></div><p class="field-help">“稳定保持”是叙事阶段名称。此前的大纲存在“-5,000→20,000”等举例，本版以逐笔账单重新计算，不沿用未勾稽的结果。</p>`,'case-assumptions');}
 function csvDownload(rows,name){const csv='\ufeff'+rows.map(row=>row.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\r\n');download(new Blob([csv],{type:'text/csv;charset=utf-8'}),name);}
 function downloadCaseSummary(){csvDownload([['声明','以下全部为虚构情境账单'],['月份','阶段','收入元','必要生活支出元','情绪消费元','盲盒元','演出总费用元','本月收支差额元','期末现金元','期末借款元','盲盒订单数'],...LINXIAO_CASE.months.map(x=>[x.month,x.stage,x.incomeCents/100,x.necessaryCents/100,x.emotionalCents/100,x.blindCents/100,x.concertCents/100,x.netCents/100,x.cashCents/100,x.debtCents/100,x.count])],'林晓_2026年1至10月_模拟月账单.csv');}
 function downloadCaseDetail(){const x=caseMonth(),rows=[...LINXIAO_CASE.supporting.filter(r=>r.month===x.month),...LINXIAO_CASE.records.filter(r=>r.date.startsWith(x.month))].sort((a,z)=>a.date.localeCompare(z.date));csvDownload([['声明','全部为虚构案例；借款与还款不是消费'],['日期','时间','事项','类别','金额元','类型','情境说明'],...rows.map(r=>[r.date,r.time||'',r.title,r.category,r.cents/100,r.flow||'情绪支出',r.note||'月度模拟归集'])],`林晓_${x.month}_模拟完整账单.csv`);}
 document.addEventListener('click',e=>{const btn=e.target.closest('button');if(!btn)return;if(btn.dataset.caseMonth){anchor=btn.dataset.caseMonth+'-'+C.monthDays(btn.dataset.caseMonth+'-01');period='month';closeModal();render();return;}if(btn.dataset.caseRecord){caseRecordDetail(btn.dataset.caseRecord);return;}if(btn.dataset.caseLedger){caseLedgerTab=btn.dataset.caseLedger;caseBill();return;}switch(btn.dataset.caseAction){case'journey':caseJourney();break;case'compare':caseCompare();break;case'assumptions':caseAssumptions();break;case'bill':caseBill();break;case'download-summary':downloadCaseSummary();break;case'download-detail':downloadCaseDetail();break;}});

 render();
})();

</script></body></html>
